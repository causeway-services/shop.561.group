name: Publication source preflight
# Public, independent source-only CI. The owning Shop parameters are a PRIVATE
# Causeway repository: never clone it into an untrusted public PR runner or
# fall back from an absent scoped private read token to github.token.
# This job is not release, fulfillment, signed payment or buyer-route receiving.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication-source-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    name: Public source contracts (private integration not qualified)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Refuse private Shop parameter leakage in public runner
        run: |
          if test -f parameters/catalog.json; then
            echo '::error title=Shop private source custody::Do not expose private seller records in public pull-request CI'
            exit 1
          fi
          echo 'Original Causeway private parameters remain outside this public runner'
      - name: Qualify original publication source and refusal controls
        run: |
          node --check scripts/audit-publication-source.mjs
          node --test test/publication-source-preflight.test.mjs
      - name: Qualify source-owned service discovery and privacy/refusal controls
        run: |
          node --check src/service-discovery.mjs
          node --test test/service-discovery.test.mjs
      - name: Qualify unsigned public buyer receiver against synthetic normal and refusal cases
        run: |
          node --check scripts/receive-public-shop.mjs
          node --test test/receive-public-shop.test.mjs
      - name: Qualify accepted-book publication feed without private catalog
        run: |
          node --check src/book-feed.mjs
          node --test test/book-feed.test.mjs
      - name: Withhold private Worker and economic acceptance explicitly
        run: |
          echo '::notice title=Source-only preflight::Private Causeway parameters, pinned Worker, Cloudflare installation, live buyer routes, paid orders and accepted delivery were not qualified by this public run'
          echo 'PUBLIC SOURCE CONTRACT ONLY. Private parameter/source integration, full dependency-closed Worker build, accepted covers and actual installed buyer-route receiving require source-authorized independent Coesite qualification. Passing this workflow does not authorize merge or deployment.' >> "$GITHUB_STEP_SUMMARY"
