name: Publication source preflight
# The source-only preflight contract and its refusal cases. Moved here from 561-group/bare-cedar-fog, which tested
# this site's files from outside; reading every listed manuscript needs the composed section tree and stays there.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication-source-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # parameters/ is the private causeway-services/public-shop-services-section
          # (catalog.json, data/records, ops): the data that parameterizes this build.
          # GITHUB_TOKEN cannot read another private repository; set the
          # PARAMETERS_READ_TOKEN secret (read-only on public-*-services-section).
          submodules: true
          token: ${{ secrets.PARAMETERS_READ_TOKEN || github.token }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the source-only preflight contract and refusal cases
        run: node --test test/publication-source-preflight.test.mjs
      # This public, dependency-free source check runs under the declared Node 24
      # toolchain; it is not full pinned-package or deployed Worker receiving.
      - name: Verify native Market service browsing and refusal behavior
        run: |
          node --check src/service-discovery.mjs
          node --test test/service-discovery.test.mjs

      - name: Verify original open-work campaign, safe checkout routes, and share pack
        run: |
          node --check src/support-campaign.mjs
          node --check scripts/export-support-campaign.mjs
          node --test test/support-campaign.test.mjs
          node scripts/export-support-campaign.mjs --json >/tmp/open-work-campaign.json
          node scripts/export-support-campaign.mjs --csv >/tmp/open-work-attribution.csv
      - name: Receive Shop public buyer-path source and six refusal cases
        run: |
          node --check scripts/receive-public-shop.mjs
          node --test test/receive-public-shop.test.mjs
          # This tests the exact source reader and controls; no network payment,
          # public deployment, cash or customer acceptance is inferred.

      - name: Observe currently deployed Shop buyer routes (not candidate acceptance)
        # An independently hosted, unsigned observation; the failing live
        # release is not confused with the independently passing source tests.
        # No checkout, customer input, credentials, payments, or deployment.
        run: |
          if node scripts/receive-public-shop.mjs; then
            echo 'Public Shop customer route is independently readable; no buyer payment or delivery is implied' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning title=Public Shop buyer route not received::Current installed public Shop failed source-qualified external receiving; inspect the per-case JSON and release custody before saying checkout works.'
            echo 'Public Shop buyer path: **NOT RECEIVED**. This nonblocking observation does not certify the proposed source or permit a release.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify source-only accepted-books Atom discovery
        run: |
          node --check src/book-feed.mjs
          node --test test/book-feed.test.mjs
      - name: Verify cross-feature Shop source integration
        run: |
          node --check test/shop-commerce-integration.test.mjs
          node --test test/shop-commerce-integration.test.mjs

      # This one PR is the release-receiving integration of existing source work.
      # No secrets, payments, deployments, new recurring tasks or billed runners.
      # Standard ubuntu-24.04 runners in this public repository are free.
      - name: Receive original author-only links without changing editions
        run: |
          node --check scripts/reconcile-authored-offer-links.mjs
          node --check scripts/edition-illustration-provenance.mjs
          node scripts/reconcile-authored-offer-links.mjs --check
          node --test test/reconcile-authored-offer-links.test.mjs test/compile-catalog.test.mjs

      - name: Qualify full pinned Shop Worker and non-deploying Wrangler bundle
        if: github.event_name == 'pull_request' && (github.head_ref == 'integration/commerce-shop-original-three-20261022' || github.head_ref == 'fix/shop-public-buyer-receiving-20261023')
        run: |
          node --version
          npx --yes pnpm@10.21.0 install --frozen-lockfile --ignore-scripts --reporter=append-only
          npm run check
          npm test
          # This standalone GitHub checkout does NOT hold the original ten
          # publisher-owned, untracked accepted cover assets. The empty
          # ephemeral directory tests ONLY Worker bundling. It is NOT a
          # releasable static-assets receipt or installation qualification.
          if [ ! -d public ]; then
            echo 'Worker-only dry-run: accepted book covers unavailable in isolated source checkout'
            mkdir -p public
          fi
          ./node_modules/.bin/wrangler deploy --dry-run --outdir /tmp/shop-561-receiving
