name: Publication source preflight
# The source-only preflight contract and its refusal cases. Moved here from 561-group/bare-cedar-fog, which tested
# this site's files from outside; reading every listed manuscript needs the composed section tree and stays there.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication-source-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the source-only preflight contract and refusal cases
        run: node --test test/publication-source-preflight.test.mjs
      # This public, dependency-free source check runs under the declared Node 24
      # toolchain; it is not full pinned-package or deployed Worker receiving.
      - name: Verify native Market service browsing and refusal behavior
        run: |
          node --check src/service-discovery.mjs
          node --test test/service-discovery.test.mjs
